        let currentRecognition = null;

        function speak(text) {
            if (!('speechSynthesis' in window)) {
                alert("Trình duyệt không hỗ trợ đọc phát âm.");
                return;
            }

            window.speechSynthesis.cancel();
            setTimeout(() => {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.85;

                let voices = window.speechSynthesis.getVoices();
                let enVoice = voices.find(voice => voice.lang.includes('en'));
                if (enVoice) utterance.voice = enVoice;

                window.speechSynthesis.speak(utterance);
            }, 50);
        }

        function resetButton(btn, delay) {
            setTimeout(() => {
                if (btn.dataset.originalHtml) {
                    btn.innerHTML = btn.dataset.originalHtml;
                    btn.className = btn.dataset.originalClass;
                }
            }, delay);
        }

        function startListening(targetWord, btnElement) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Trình duyệt không hỗ trợ thu âm. Vui lòng sử dụng Google Chrome.");
                return;
            }

            if (currentRecognition) {
                try { currentRecognition.stop(); } catch(e){}
            }

            if (!btnElement.dataset.originalHtml) {
                btnElement.dataset.originalHtml = btnElement.innerHTML;
                btnElement.dataset.originalClass = btnElement.className;
            }

            const recognition = new SpeechRecognition();
            currentRecognition = recognition;
            recognition.lang = 'en-US';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            btnElement.innerHTML = '🎙️ Đang nghe...';
            btnElement.className = 'bg-red-500 text-white px-4 py-2 rounded-full shadow-md flex items-center gap-1 text-sm font-semibold animate-pulse';

            recognition.onresult = function(event) {
                const speechResult = event.results[0][0].transcript.toLowerCase().replace(/[.,!?]/g, '').trim();
                const cleanTargetWord = targetWord.toLowerCase().replace(/[.,!?]/g, '').trim();

                if (speechResult === cleanTargetWord) {
                    btnElement.innerHTML = '🎉 Giỏi quá!';
                    btnElement.className = 'bg-yellow-500 text-white px-4 py-2 rounded-full shadow-md flex items-center gap-1 text-sm font-semibold';
                    
                    confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 }, colors: ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff'] });
                    
                    const successSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3');
                    successSound.play();
                } else {
                    btnElement.innerHTML = '❌ Lệch rồi (' + speechResult + ')';
                    btnElement.className = 'bg-gray-500 text-white px-4 py-2 rounded-full shadow-md flex items-center gap-1 text-sm font-semibold';
                }
                resetButton(btnElement, 3000);
            };

            recognition.onerror = function(event) {
                let errorMsg = '⚠️ Lỗi mic';
                if (event.error === 'not-allowed') errorMsg = '⚠️ Bị chặn mic';
                else if (event.error === 'no-speech') errorMsg = '⚠️ Trật tự quá';
                
                btnElement.innerHTML = errorMsg;
                btnElement.className = 'bg-gray-500 text-white px-4 py-2 rounded-full shadow-md flex items-center gap-1 text-sm font-semibold';
                resetButton(btnElement, 2500);
            };

            recognition.onend = function() {
                if (btnElement.innerHTML === '🎙️ Đang nghe...') resetButton(btnElement, 0);
            };

            try { recognition.start(); } catch (e) { resetButton(btnElement, 0); }
        }

                            </div>
                            <div class="flex gap-2 w-full justify-center">
                                <button onclick="event.stopPropagation(); speak('${item.word.replace(/'/g, "\\'")}')" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-full transition-transform active:scale-90 shadow-md flex items-center gap-1 text-sm font-semibold">
                                    🔊 Nghe
                                </button>
                                <button onclick="event.stopPropagation(); startListening('${item.word.replace(/'/g, "\\'")}', this)" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-full transition-transform active:scale-90 shadow-md flex items-center gap-1 text-sm font-semibold">
                                    🎙️ Đọc thử
                                </button>
                            </div>
                        </div>

                        <div class="card-back absolute inset-0 bg-white border-4 border-blue-200 shadow-lg p-6 flex flex-col justify-center items-center text-center">
                            <h3 class="text-2xl font-bold text-red-500 mb-3">${item.meaning}</h3>
                            <p class="text-gray-700 text-base italic leading-relaxed">"${item.example}"</p>
                            <div class="mt-6 text-sm text-gray-400 bg-gray-50 px-3 py-1 rounded-full">
                                🔄 Chạm để quay lại
                            </div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterData() {
            const searchTerm = searchInput.value.toLowerCase();
            const selectedUnit = unitFilter.value;

            const filtered = vocabulary.filter(item => {
                const matchesSearch = item.word.toLowerCase().includes(searchTerm) || item.meaning.toLowerCase().includes(searchTerm);
                const matchesUnit = selectedUnit === 'all' || item.unit.toString() === selectedUnit;
                return matchesSearch && matchesUnit;
            });
            renderWords(filtered);
        }

        searchInput.addEventListener('input', filterData);
        unitFilter.addEventListener('change', filterData);

        renderWords(vocabulary);
    </script>
</body>
</html>
